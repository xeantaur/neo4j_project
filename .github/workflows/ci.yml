name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Run unit and API tests
        run: python -m pytest -m "not integration" -v

      - name: Bytecode compilation check
        run: python -m compileall src tests

  frontend:
    name: Frontend Quality & Build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Vitest test suite
        run: cd frontend && npm run test:run

      - name: Run production build
        run: cd frontend && npm run build

      - name: Run linter
        run: cd frontend && npm run lint

      - name: Audit runtime dependencies
        run: cd frontend && npm audit --omit=dev

  neo4j-integration:
    name: Live Neo4j Integration Tests
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.29-community
        env:
          NEO4J_AUTH: neo4j/phase6-ci-password
          NEO4J_PLUGINS: "[]"
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p phase6-ci-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live Neo4j integration tests
        env:
          RUN_NEO4J_INTEGRATION: "1"
          NEO4J_TEST_URI: "bolt://localhost:7687"
          NEO4J_TEST_USERNAME: "neo4j"
          NEO4J_TEST_PASSWORD: "phase6-ci-password"
        run: python -m pytest -m integration -v
