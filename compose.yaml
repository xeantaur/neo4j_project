# Disposable Neo4j 5 Test Database (For Integration Testing Only)
# Usage:
#   docker compose up -d neo4j-test
#   RUN_NEO4J_INTEGRATION=1 NEO4J_TEST_URI=bolt://localhost:17687 NEO4J_TEST_USERNAME=neo4j NEO4J_TEST_PASSWORD=phase6-test-password pytest -m integration -v
#   docker compose down
services:
  neo4j-test:
    image: neo4j:5.26.29-community
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      - NEO4J_AUTH=neo4j/phase6-test-password
      - NEO4J_PLUGINS=[]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p phase6-test-password 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
